name: Build DRUMLAB IPA for Sideloadly

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true

      - name: Build unsigned iPad app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/Release-iphoneos"
          set -o pipefail
          xcodebuild \
            -project DRUMLAB-iPad.xcodeproj \
            -target DRUMLAB \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload Xcode compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRUMLAB-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Release-iphoneos/DRUMLAB.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DRUMLAB.app
          zip -qry DRUMLAB-sideloadly.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRUMLAB-sideloadly-ipa
          path: DRUMLAB-sideloadly.ipa
          retention-days: 7
